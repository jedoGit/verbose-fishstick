apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: pod-pv-server-inspector
  name: pod-pv-server-inspector
  namespace: ns
spec:
  restartPolicy: Never
  containers:
  - image: busybox
    name: pod-pv-server-inspector
    command: ["/bin/sh", "-c", "ls -lrt /mnt/image/data"]
    volumeMounts:
    - mountPath: /mnt/image/data
      name: pv-server-storage
    resources: {}
  volumes:
  - name: pv-server-storage
    persistentVolumeClaim:
      claimName: pv-server-claim  
status: {}
