services:
  rest-api-client:
    restart: on-failure
    build: ./REST-Service-Blog/REST-API-Client
    container_name: client
    depends_on:
      - rest-api-server
    ports:
      - "3000:3000"

  rest-api-server:
    restart: always
    build: ./REST-Service-Blog/REST-API-Server
    ports:
      - "8081:8081"
    volumes:
      - rest-api-server-images:/home/node/app/server/images
    container_name: api
    depends_on:
      - mongo_db
      - nginx

  nginx:
    restart: always
    image: nginx:latest
    container_name: nginx
    volumes:
      - "./REST-Service-Blog/Nginx/default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - "80:80"

  mongo_db:
    image: mongo:4.2.0-bionic
    restart: always
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
     MONG0_INITDB_ROOT_USERNAME: "root"
     MONG0_INITDB_ROOT_PASSWORD: "1234qwerasdf!@#$"
    volumes:
      - mongo_db:/data/db

volumes:
  mongo_db: {}
  rest-api-server-images: {}
