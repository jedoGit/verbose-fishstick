version: "3.9"
services:
  rest-api-client:
    restart: on-failure
    build: ./REST-Service-Blog/REST-API-Client
    ports:
      - "3000:3000"

  rest-api-server:
    restart: on-failure
    build: ./REST-Service-Blog/REST-API-Server
    ports:
      - "8081:8081"
    volumes:
      - rest-api-server:/home/node/app/server/images
    depends_on:
      - mongo_db

  mongo_db:
    container_name: db_container
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_db:/data/db

volumes:
  mongo_db: {}
  rest-api-server: {}
