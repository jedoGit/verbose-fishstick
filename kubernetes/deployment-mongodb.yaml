apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: mongodb
    run: mongodb
  name: mongodb
  namespace: ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mongodb
        run: mongodb
    spec:
      containers:
      - image: mongo:4.2.0-bionic
        imagePullPolicy: Never
        name: mongodb
        ports:
        - containerPort: 27017
        volumeMounts:
        - mountPath: /data/db
          name: pv-db-storage
        resources: {}
      volumes:
      - name: pv-db-storage
        persistentVolumeClaim:
          claimName: pv-db-claim
status: {}
